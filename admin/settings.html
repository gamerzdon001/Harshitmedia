<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - Harshit Media Editfy</title>

    <link rel="stylesheet" href="settings.css">
</head>

<body>

<div class="admin-layout">

<aside class="sidebar">

    <div class="brand">
        <div class="brand-logo">HME</div>

        <div>
            <h2>HARSHIT MEDIA</h2>
            <span>EDITFY ADMIN</span>
        </div>
    </div>

    <nav class="admin-nav">

        <a href="dashboard.html" class="nav-item">
            📊 Dashboard
        </a>

        <a href="videos.html" class="nav-item">
            🎬 My Videos
        </a>

        <a href="upload.html" class="nav-item">
            ⬆️ Upload Video
        </a>

        <a href="messages.html" class="nav-item">
            💬 Messages
        </a>

        <a href="settings.html" class="nav-item active">
            ⚙️ Settings
        </a>

    </nav>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</aside>
<main class="main-content">

    <div class="topbar">
        <div>
            <h1>Settings</h1>
            <p>Manage your admin panel settings</p>
        </div>
    </div>

    <section class="settings-section">

        <div class="section-header">
            <h2>Website Settings</h2>
            <p>Update your portfolio information</p>
        </div>
        
    <div class="settings-card">

        <h3>Profile Information</h3>

        <div class="form-group">
            <label>Editor Name</label>
            <input type="text" value="Harshit">
        </div>

        <div class="form-group">
            <label>Website Name</label>
            <input type="text" value="Harshit Media Editfy">
        </div>

        <div class="form-group">
            <label>About</label>
            <textarea rows="4">Professional Video Editor</textarea>
        </div>

        <button class="save-btn">
            Save Changes
        </button>

    </div>

    <div class="settings-card">

        <h3>Contact Information</h3>

        <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="text" placeholder="Enter WhatsApp number">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter email address">
        </div>

        <div class="form-group">
            <label>Instagram Username</label>
            <input type="text" placeholder="@username">
        </div>

        <div class="form-group">
            <label>Contact Message</label>
            <textarea rows="3" placeholder="Enter your contact message"></textarea>
        </div>

        <button class="save-btn">
            Save Contact Settings
        </button>

    </div>
    </section>

</main>

</div>

<script src="settings.js"></script>

</body>
</html>
