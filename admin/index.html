<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Harshit Media Editfy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            HME
        </div>

        <h1>HARSHIT MEDIA EDITFY</h1>
        <p class="subtitle">ADMIN PANEL</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit">
                LOGIN
            </button>

            <p id="errorMessage"></p>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
