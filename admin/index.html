<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Harshit Media Edit — Admin Login</title>

  <meta name="description" content="Harshit Media Edit Admin Panel">
  <meta name="theme-color" content="#0b0b0f">

  <link rel="icon" type="image/svg+xml" href="images/harshit-media-logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <!-- Background Effects -->
  <div class="background-effects">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
  </div>

  <!-- Login Container -->
  <main class="login-page">

    <section class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <img
          src="images/harshit-media-logo.svg"
          alt="Harshit Media Edit"
        >
      </div>

      <!-- Heading -->
      <div class="login-heading">
        <span class="login-badge">ADMIN PANEL</span>

        <h1>Welcome Back</h1>

        <p>
          Sign in to manage your Harshit Media Edit website.
        </p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form">

        <!-- Username -->
        <div class="form-group">

          <label for="username">
            Username
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              autocomplete="username"
              required
            >

          </div>

        </div>

        <!-- Password -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect
                  x="3"
                  y="11"
                  width="18"
                  height="10"
                  rx="2"
                ></rect>

                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              <svg
                id="eyeIcon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>
            </button>

          </div>

        </div>

        <!-- Remember Me -->
        <div class="login-options">

          <label class="remember-me">

            <input
              type="checkbox"
              id="rememberMe"
            >

            <span class="custom-checkbox"></span>

            <span>
              Remember me
            </span>

          </label>

        </div>

        <!-- Error Message -->
        <div
          id="loginError"
          class="login-message error-message"
          role="alert"
          aria-live="polite"
        ></div>

        <!-- Success Message -->
        <div
          id="loginSuccess"
          class="login-message success-message"
          role="status"
          aria-live="polite"
        ></div>

        <!-- Login Button -->
        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >

          <span class="button-text">
            Sign In
          </span>

          <span
            class="button-loader"
            aria-hidden="true"
          ></span>

          <svg
            class="button-arrow"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>

        </button>

      </form>

      <!-- Login Footer -->
      <div class="login-footer">

        <div class="security-note">

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>

          <span>
            Secure Admin Access
          </span>

        </div>

        <p>
          © <span id="currentYear"></span>
          Harshit Media Edit
        </p>

      </div>

    </section>

  </main>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
